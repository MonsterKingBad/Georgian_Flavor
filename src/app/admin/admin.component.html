<div class="admin-container">
    <h1>Admin პანელი</h1>
    <button (click)="onAddDish()">დაამატე ახალი კერძი</button>
    <ul>
      <li *ngFor="let dish of dishes">
        <h2>{{ dish.name }}</h2>
        <p>{{ dish.author }}</p>
        <img [src]="dish.image" alt="Dish image" width="100" />
        <button (click)="onEditDish(dish.id)">რედაქტირება</button>
        <button (click)="onDeleteDish(dish.id)">წაშლა X</button>
      </li>
    </ul>
  </div>
